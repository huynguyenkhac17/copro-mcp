[project]
name = "copro-mcp"
version = "0.4.0"
description = "MCP server that delegates side tasks from Claude Code to a pool of cloud/local LLM workers (Groq, Gemini, Mistral, DeepSeek, OpenRouter, Ollama) with routing, fallback, quota awareness and guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.urls]
Repository = "https://github.com/huynguyenkhac17/Agentic_Routing"
Changelog = "https://github.com/huynguyenkhac17/Agentic_Routing/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "prometheus_client>=0.20",
]
# Local RAG over large directories (rag.enabled, needs Ollama embeddings).
rag = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
]
# Separate from the server's own dependencies: the MCP server imports neither.
metrics = [
    "prometheus_client>=0.20",
]
eval = [
    "ragas>=0.3",
    "openai>=1.40",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.
    "langchain-community<0.4",
]

[project.scripts]
copro = "copro.commands:run"
copro-mcp = "copro.server:main"
# Old names, kept until 0.4.x ends (copro/_legacy.py).
llm-worker-pool = "copro._legacy:llm_worker_pool"
worker-stats = "copro._legacy:worker_stats"
worker-metrics = "copro._legacy:worker_metrics"
worker-eval = "copro._legacy:worker_eval"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The YAML defaults are read at runtime (config/settings.py): without this a wheel
# installs the code but not its config, and the server fails on startup.
copro = ["config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
