[project]
name = "llm-worker-pool"
version = "0.2.0"
description = "MCP server: LLM Worker Pool - middleware between Claude Code and local/cloud LLM workers (Ollama, Gemini, and future providers)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
llm-worker-pool = "llm_worker_pool.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
