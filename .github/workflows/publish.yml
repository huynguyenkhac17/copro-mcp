name: Publish to PyPI

# Push a tag such as v0.4.0 to publish that version. No token is stored anywhere:
# PyPI trusts this workflow through OpenID Connect ("trusted publishing"), configured
# once on pypi.org for this repository, this file and the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tag matches the package version
        # A tag that disagrees with pyproject.toml would publish a version nobody tagged.
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Unit tests
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run --no-sync python -m pytest -q
      - name: Build
        run: uv build
      - name: Smoke test the wheel over MCP stdio
        run: |
          uv tool install --python 3.12 dist/*.whl
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke "mcp>=1.2.0"
          .smoke/bin/python scripts/smoke_mcp_stdio.py "$(uv tool dir --bin)/copro-mcp"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Approval rules, if any, live on this environment (Settings > Environments).
    environment:
      name: pypi
      url: https://pypi.org/project/copro-mcp/
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
