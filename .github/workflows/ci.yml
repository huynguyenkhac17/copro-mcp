name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; the other OSes once (macOS minutes cost 10x
        # on a private repository).
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Unit tests
        # No API keys and no Ollama here: cloud providers are skipped, integration
        # tests skip themselves.
        run: uv run --no-sync python -m pytest -q

  install-smoke:
    # What a user does: build the wheel, `uv tool install` it, start the server over
    # stdio and call it as an MCP client. Catches config or data files missing from
    # the package (a wheel install failed at startup before 0.3.0).
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Install the wheel as a uv tool
        shell: bash
        run: uv tool install --python 3.12 dist/*.whl
      - name: MCP stdio smoke test
        shell: bash
        run: |
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke "mcp>=1.2.0"
          bin="$(uv tool dir --bin)"
          exe="$bin/llm-worker-pool"
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          if [ -x .smoke/bin/python ]; then py=.smoke/bin/python; else py=.smoke/Scripts/python.exe; fi
          "$py" scripts/smoke_mcp_stdio.py "$exe"
