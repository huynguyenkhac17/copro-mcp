# Task profiles, selected by delegate_task's `task_type` (omit it = no profile, the
# exact pre-profile behaviour). Same idea as budgets.yaml: add a kind of work here,
# no code change needed.
#
# Fields (all optional):
#   description     shown in the delegate_task tool description
#   system_addon    appended to the budget's system prompt
#   default_budget  used when the request does not set `budget`
#   output_format   text | json - used when the request does not set it
#   json_schema     used when the request gives no json_schema (json output only)
#   validators      post-checks on the answer:
#                     json_repair - one retry on the same tier when the JSON does not
#                                   parse or fails the schema
#                     citations   - check every path:line / {file, line} against the
#                                   files in the context (result.verification)
#
# Keep this file pure ASCII (see the note in default.yaml).

task_types:
  review:
    description: Bug/security review of code; findings as JSON with file, line and a verbatim quote.
    default_budget: L3
    output_format: json
    system_addon: >
      You are reviewing code for real defects: correctness, security, concurrency,
      resource handling, broken edge cases. Report only issues you can point at in
      the provided files. For each finding give the file path exactly as it appears
      in the context header, the 1-based line number, a severity, a one-sentence
      claim, and evidence_quote: the offending code copied verbatim from that line.
      Do not report style nits. An empty findings list is a valid answer.
    json_schema:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            type: object
            required: [file, line, severity, claim, evidence_quote]
            properties:
              file: {type: string}
              line: {type: integer}
              severity: {type: string, enum: [high, medium, low]}
              claim: {type: string}
              evidence_quote: {type: string}
    validators: [json_repair, citations]
    # Run on two vendors in parallel and merge findings (cross_check_orchestrator.py):
    # groq finds more bugs but cites lines less precisely, gemini-lite the reverse
    # (copro eval harness-compare, 2026-10-30). Callers can pass cross_check=false.
    cross_check: true
    cross_check_providers: [groq, gemini-lite]

  summarize:
    description: Summary of files/text grounded strictly in the content.
    default_budget: L2
    system_addon: >
      Summarize only what the input actually says or does. Do not add features,
      motives or behaviour that are not visible in it; if something is unclear,
      say it is unclear rather than guessing. When you refer to code, name the
      function or file.
    validators: [citations]

  extract:
    description: Pull specific fields out of the input as JSON.
    default_budget: L1
    output_format: json
    system_addon: >
      Extract exactly the requested fields from the input. Copy values as written;
      never infer or invent a value that is not present - use null instead. Do not
      copy credentials or secrets into the answer even if they are present.
    validators: [json_repair]

  classify:
    description: Assign one label from a given set.
    default_budget: L1
    output_format: json
    system_addon: >
      Choose exactly one label from the set given in the task. Return it in a JSON
      object as {"label": "<label>", "reason": "<one short sentence>"} unless the
      task gives another schema.
    json_schema:
      type: object
      required: [label]
      properties:
        label: {type: string}
        reason: {type: string}
    validators: [json_repair]

  explain:
    description: Explanation of how code behaves, citing where.
    default_budget: L2
    system_addon: >
      Explain the behaviour by tracing the code that is actually in the context.
      Cite the relevant spots as path:line. If the answer depends on code that is
      not in the context, say so instead of assuming how it works.
    validators: [citations]

  translate:
    description: Translation preserving meaning, tone and formatting.
    default_budget: L1
    system_addon: >
      Translate faithfully: keep meaning, tone, formatting, code, identifiers and
      numbers unchanged. Return only the translation, with no notes.

  generate:
    description: Boilerplate / code / docs generation.
    default_budget: L2
    system_addon: >
      Produce complete, ready-to-use output that follows the conventions visible in
      the provided context (naming, style, imports). Do not leave placeholders such
      as TODO or "..." unless the task asks for them.
