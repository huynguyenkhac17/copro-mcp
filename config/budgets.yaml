# Execution budgets definitions (L1/L2/L3).
# Add new budget = add 1 entry here, NO code changes needed.
#
# Note on num_ctx: For limited VRAM hardware, large models (e.g. 9B parameters)
# take up significant memory. KV cache increases with num_ctx, so the values
# below are chosen conservatively to ensure stability without exhausting VRAM.
# You can tune these up if you monitor that you have enough free memory.

budgets:
  L1:
    description: >
      Fast, deterministic, used for simple tasks: categorization, extraction,
      short answers without deep reasoning.
    timeout_seconds: 20
    options:
      system_prompt: >
        You are a fast-acting assistant. Provide concise, accurate answers that
        get straight to the point, without lengthy explanations.
      temperature: 0.1
      top_p: 0.8
      top_k: 20
      repeat_penalty: 1.1
      num_predict: 256
      num_ctx: 4096
      seed: 42
      stop: []
      # qwen3.5 is "thinking" model: if turn on thinking, it will use all
      # num_predict for thinking and no token left for response. L1 prioritize speed so turn off thinking.
      think: false

  L2:
    description: >
      Balancing speed and quality: summarizing files,
      moderate refactoring, and explaining code.
    timeout_seconds: 60
    options:
      system_prompt: >
        You are a software engineer supporting Claude Code. Read the
        provided context carefully and think
        critically before answering.
      temperature: 0.4
      top_p: 0.9
      top_k: 40
      repeat_penalty: 1.1
      num_predict: 1024
      num_ctx: 12288
      stop: []

  L3:
    description: >
      Highest quality, large context: reading multiple files, architectural
      analysis, implementation planning, candidate bug discovery.
    timeout_seconds: 180
    options:
      system_prompt: >
        You are a senior software architect. Analyze carefully,
        consider multiple aspects (architecture, edge cases, risks)
        before concluding. When asked to return JSON,
        ensure the structure is correct.
      temperature: 0.6
      top_p: 0.95
      top_k: 60
      repeat_penalty: 1.05
      num_predict: 4096
      num_ctx: 24576
      stop: []
