# Default configuration for the LLM Worker Pool.
# Any value here can be overridden by environment variables prefixed with
# LLM_WORKER_POOL_ (e.g., LLM_WORKER_POOL_OLLAMA__MODEL=qwen2.5-coder:7b),
# or by pointing to a different config file via LLM_WORKER_POOL_CONFIG.

default_provider: gemini
providers:
  ollama:
    type: ollama
    endpoint: http://localhost:11434
    # Must match a tag actually present in `ollama list` - the previous value
    # (qwen2.5-coder:7b) was not installed, which failed the integration tests
    # with "model not found". :latest resolves to the same 7B weights.
    model: qwen2.5-coder:latest
    # Max parallel requests for this provider. Omit to use the type-based default
    # (ollama -> 1, since limited VRAM can easily overflow with concurrent
    # large-context requests). Increase only if you have enough free VRAM.
  gemini:
    type: openai_compatible
    endpoint: https://generativelanguage.googleapis.com/v1beta/openai
    # "-latest" is a dynamic alias pointing to the latest stable flash version,
    # avoiding the need to manually update when specific model versions are deprecated.
    model: gemini-flash-latest
    # api_key_env: GEMINI_API_KEY
    # Round-robin across 9 keys. GEMINI_API_KEY is a Windows user-level env var;
    # the other eight live in .env. load_dotenv runs with override=False so a real
    # env var always beats .env - never declare the same name twice, or one key
    # gets counted twice and the rotation is skewed.
    #
    # This list previously named GEMINI_API_KEY_1 and _2, but neither variable was
    # ever set, so the pool was in fact running on a SINGLE key and hit 429 almost
    # immediately - while the log only said "quota exceeded", never "missing key".
    #
    # 2026-09-29: _2 and _5 were replaced after their projects were banned by
    # Google (403 "Your project has been denied access" - permanent, only a key
    # from a different project fixes it).
    api_key_envs:
      - GEMINI_API_KEY
      - GEMINI_API_KEY_2
      - GEMINI_API_KEY_3
      - GEMINI_API_KEY_4
      - GEMINI_API_KEY_5
      - GEMINI_API_KEY_6
      - GEMINI_API_KEY_7
      - GEMINI_API_KEY_8
      - GEMINI_API_KEY_9
    per_key_concurrency: 2  # 2 concurrent requests per API key (9 keys * 2 = 18 total capacity)

  # First fallback tier for gemini, mirroring Deeplearn's flash -> flash-lite cascade:
  # a 503 "model overloaded" is per-MODEL, so the lite model on the very same keys
  # usually still answers while flash is saturated.
  gemini-lite:
    type: openai_compatible
    endpoint: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-flash-lite-latest
    api_key_envs:
      - GEMINI_API_KEY
      - GEMINI_API_KEY_2
      - GEMINI_API_KEY_3
      - GEMINI_API_KEY_4
      - GEMINI_API_KEY_5
      - GEMINI_API_KEY_6
      - GEMINI_API_KEY_7
      - GEMINI_API_KEY_8
      - GEMINI_API_KEY_9
    per_key_concurrency: 2

  # Groq speaks the OpenAI protocol, so it reuses the openai_compatible adapter -
  # no new code. Its value here is not quality but INFRASTRUCTURE INDEPENDENCE:
  # when Gemini returns 503 because Google itself is overloaded, every Gemini key
  # fails alike, and only a different vendor can rescue the run.
  #
  # Model picked from this account's real catalogue (listed via /v1/models):
  # openai/gpt-oss-120b is the strongest chat model served there.
  #
  # NOTE: keep this file pure ASCII. The YAML loader opens it with the platform
  # default encoding (cp1252 on Windows), so a single accented character here
  # crashes the server at startup with a UnicodeDecodeError.
  groq:
    type: openai_compatible
    endpoint: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_envs:
      - GROQ_API_KEY_1
      - GROQ_API_KEY_2
      - GROQ_API_KEY_3
      - GROQ_API_KEY_4
    # Free tier: 30 RPM, 1K RPD, 8K TPM, 200K TPD per key (response headers + docs,
    # 2026-10-07). A request whose prompt alone exceeds 8K tokens is refused with 413,
    # so larger prompts skip Groq locally and go straight to the next tier. 6000 leaves
    # headroom: the chars/4 estimate undercounts code and Vietnamese text.
    max_prompt_tokens: 6000

# Fallback chains, tried in order when a provider still fails after retries
# (503 overload, 429 quota, timeout, bad key...). The last tier is a different
# vendor, so even a Google-wide outage is survivable. ollama deliberately has no
# chain: a request routed there for confidentiality must never reach the cloud.
# Default provider per budget when the request names none. Groq leads L1/L2: in the
# 2026-10-07 benchmark gpt-oss-120b answered L2 in ~1s with full accuracy and never
# returned 503, while gemini-flash-latest took ~20-35s and 503'd on a third of calls.
# Prompts over groq's max_prompt_tokens fall through to the gemini tiers.
budget_providers:
  L1: groq
  L2: groq
  # L3 too: on the 2026-10-07 seeded-bug review test gpt-oss-120b found 4/4 bugs on
  # every run in ~2.5s; most L3 prompts exceed max_prompt_tokens and skip it locally.
  L3: groq

# Chain for a budget's own provider (overrides `fallbacks` for budget-routed requests).
# L3 tries lite before flash (changed 2026-10-30). The 2026-10-07 test had flash
# ahead (4/4 seeded bugs vs lite's 3/4), but since then flash has rarely answered:
# 27/28 L3 jobs on 2026-10-24 timed out on it, and worker-eval on 2026-10-30 got
# 1/9 answers (92s, the rest 429/timeout) while lite answered 9/9 with full bug
# recall. Flash stays as the last tier, for when lite itself is down.
budget_fallbacks:
  L3: [gemini-lite, gemini]

fallbacks:
  gemini: [gemini-lite, groq]
  gemini-lite: [groq]
  groq: [gemini-lite, gemini]

# Cap (seconds) on a tier that still has a fallback behind it; the last tier keeps
# the budget's full timeout. On 2026-10-06 gemini-flash-latest accepted L3 calls and
# then never answered, so every review waited the full 300s before flash-lite ran.
# Note: gemini-lite is not the last tier (groq is), so it is capped too - fine, it
# answered in 9-23s that day; groq's free tier rejects L3-sized prompts (8k TPM).
# 90 -> 40 on 2026-10-07: every flash call that did answer took 6-27s, so waiting
# longer only delays lite; with 90 the L3 p50 sat at ~93s (6 concurrent calls).
tier_timeout_seconds: 40

# reasoning_effort once the chain has fallen back past the requested provider, when
# the budget asks for medium/high. flash-lite at L3 medium spent 7.9k of an 8k
# num_predict thinking and returned truncated answers.
fallback_reasoning_effort: low

# Default timeout (seconds) if the budget does not explicitly define one.
timeout_seconds: 60

retry:
  # Kept low on purpose: an overloaded model rarely recovers within seconds, so the
  # fallback chain (see `fallbacks`) is a faster rescue than hammering the same one.
  max_attempts: 4
  backoff_base_seconds: 0.5

logging:
  level: INFO
  # Enable only for local dev/debug - logs the full content of tasks/contexts/responses.
  debug_log_content: false

file_access:
  # List of allowed root directories that can be read via the file_paths parameter of delegate_task.
  # Empty = feature DISABLED (secure default). Example to enable for a project:
  #   allowed_roots: ["D:/project/mcp"]
  allowed_roots: ["D:/"]
  max_file_bytes: 200000
  max_total_bytes: 800000
  # A file_paths item may be a directory (walked recursively) or a glob
  # ("D:/repo/src/**/*.py"). .git, node_modules, .venv, build output and lockfiles
  # are pruned while walking; files are taken most useful first (README, source,
  # tests, docs, then config), so the byte budget drops the noise, not the code.
  max_dir_files: 300
  max_dir_depth: 12
  max_dir_entries: 20000

url_fetch:
  # Lets delegate_task fetch `urls` server-side: web pages are reduced to text,
  # github.com/<owner>/<repo>[/tree/<ref>/<dir>] is shallow-cloned and inlined.
  enabled: true
  max_bytes_per_url: 1000000
  max_total_chars: 800000
  timeout_seconds: 30
  # Keep false: refuses localhost / private-network targets (SSRF guard), since
  # URLs come from prompts.
  allow_private_hosts: false
  repo_max_file_bytes: 100000

cache:
  # Caches provider responses by (final prompt + options), avoiding repeated
  # inference/GPU costs for the exact same question.
  enabled: true
  max_entries: 256
  ttl_seconds: 3600

jobs:
  ttl_seconds: 3600
  max_entries: 1000

conversations:
  # continuation_id follow-ups. Kept in server memory only: lost on restart. Each
  # entry holds its whole context, so keep max_entries modest.
  enabled: true
  ttl_seconds: 3600
  max_entries: 50
  # Older turns are dropped first; history is also trimmed to the budget's num_ctx.
  max_turns: 20

rag:
  # Only used when the full text of the files would not fit the budget's num_ctx
  # (minus the reserve for prompt/answer); below that the model gets every file
  # verbatim, which beats top_k chunks for review. Needs a local Ollama.
  enabled: true
  embedding_endpoint: http://localhost:11434
  embedding_model: nomic-embed-text
  chunk_size_tokens: 256
  overlap_tokens: 32
  top_k: 10

circuit_breaker:
  # Auto-quarantine keys after repeated 429/403/503 errors to protect pool stability
  enabled: true
  failure_threshold: 3
  quarantine_seconds: 60.0

quota:
  # Pre-flight checks (infra/quota_tracker.py): a tier known to be out of quota or
  # hanging is skipped before the call when a fallback tier is behind it; the last
  # tier is always tried. Signals: Groq x-ratelimit-* headers on every response,
  # retryDelay / Retry-After on a 429 (Gemini sends no rate-limit headers at all),
  # and calls cancelled by the tier deadline (gemini-flash hangs rather than 429s).
  enabled: true
  safety_margin_tokens: 500
  # Two unanswered calls in a row -> skip the model for timeout_block_seconds.
  timeouts_before_block: 2
  timeout_block_seconds: 120
  # A 429 naming a per-day quota parks that key this long, not just its retryDelay.
  daily_quota_block_seconds: 3600

metrics:
  # Every server instance appends one JSONL line per call to the shared event log;
  # `worker-metrics` (separate process, [metrics] extra) serves it as Prometheus
  # metrics on exporter_host:exporter_port. Task/response text is never logged
  # unless logging.debug_log_content is on.
  enabled: true
  # event_log_path: ~/.llm_worker_pool/events.jsonl
  max_bytes: 50000000
  exporter_host: 127.0.0.1
  exporter_port: 9464
  # eval_latest_path: ~/.llm_worker_pool/eval_latest.json  (written by worker-eval)

guardrails:
  # Never read these through file_paths, even inside allowed_roots (allowed_roots is
  # the whole D:/ drive, which includes this repo's own .env with every API key).
  # A glob without "/" matches the file name, one with "/" the whole path.
  # Omit deny_globs to use the built-in list; extra_deny_globs adds to it.
  # deny_globs: [".env*", "*.pem", "*.key", "*id_rsa*", "*id_ed25519*", "credentials*.json", "**/.git/**"]
  extra_deny_globs: []
  # Replace secret-looking literals (AIza..., gsk_..., sk-..., ghp_..., PEM private
  # keys, password="...", SECRET_TOKEN=..., user:pass@ in URLs) with
  # [REDACTED:<kind>] whenever any tier of the fallback chain is a cloud provider,
  # and flag secrets that show up in an answer.
  redact_secrets: true
  # extra_patterns: {internal_token: "itk_[0-9a-f]{32}"}
  # Providers whose traffic never leaves the machine (type ollama counts automatically).
  local_providers: [ollama]

eval:
  # worker-eval judge (RAGAS, [eval] extra): an openai_compatible provider entry above.
  # When an eval arm uses the same model, the report flags the self-preference risk.
  # gemini-lite, not flash: on 2026-10-30 gemini-flash-latest timed out even on a
  # "Say OK" prompt, which stalled the first baseline run for 30 minutes in judge
  # calls. Override per run with `worker-eval --judge-provider gemini`.
  judge_provider: gemini-lite
  judge_reasoning_effort: low
  judge_timeout_seconds: 90
  judge_max_retries: 2
  # AnswerRelevancy needs embeddings: Ollama's OpenAI-compatible endpoint, local and free.
  # Skipped (noted in the report) when unreachable.
  embedding_endpoint: http://localhost:11434/v1
  embedding_model: nomic-embed-text
  max_concurrency: 3
