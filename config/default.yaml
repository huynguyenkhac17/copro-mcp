# Default configuration for the LLM Worker Pool.
# Any value here can be overridden by environment variables prefixed with
# LLM_WORKER_POOL_ (e.g., LLM_WORKER_POOL_OLLAMA__MODEL=qwen2.5-coder:7b),
# or by pointing to a different config file via LLM_WORKER_POOL_CONFIG.

default_provider: gemini
providers:
  ollama:
    type: ollama
    endpoint: http://localhost:11434
    model: qwen2.5-coder:7b
    # Max parallel requests for this provider. Omit to use the type-based default
    # (ollama -> 1, since limited VRAM can easily overflow with concurrent
    # large-context requests). Increase only if you have enough free VRAM.
  gemini:
    type: openai_compatible
    endpoint: https://generativelanguage.googleapis.com/v1beta/openai
    # "-latest" is a dynamic alias pointing to the latest stable flash version,
    # avoiding the need to manually update when specific model versions are deprecated.
    model: gemini-flash-latest
    # api_key_env: GEMINI_API_KEY
    api_key_envs: ["GEMINI_API_KEY", GEMINI_API_KEY_1, GEMINI_API_KEY_2]  # round-robin across multiple keys
    # concurrency: 10  # omit to use the type-based default (non-ollama -> 5)

# Default timeout (seconds) if the budget does not explicitly define one.
timeout_seconds: 60

retry:
  max_attempts: 3
  backoff_base_seconds: 0.5

logging:
  level: INFO
  # Enable only for local dev/debug - logs the full content of tasks/contexts/responses.
  debug_log_content: false

file_access:
  # List of allowed root directories that can be read via the file_paths parameter of delegate_task.
  # Empty = feature DISABLED (secure default). Example to enable for a project:
  #   allowed_roots: ["D:/project/mcp"]
  allowed_roots: ["D:/project"]
  max_file_bytes: 200000
  max_total_bytes: 800000

cache:
  # Caches provider responses by (final prompt + options), avoiding repeated
  # inference/GPU costs for the exact same question.
  enabled: true
  max_entries: 256
  ttl_seconds: 3600

jobs:
  ttl_seconds: 3600
  max_entries: 1000

rag:
  enabled: true
  embedding_model: nomic-embed-text
  chunk_size_tokens: 256
  overlap_tokens: 32
  top_k: 10
