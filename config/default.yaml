# Cau hinh mac dinh cua Local AI Gateway.
# Moi gia tri o day co the bi override boi bien moi truong voi prefix
# LOCAL_AI_GATEWAY_ (vi du LOCAL_AI_GATEWAY_OLLAMA__MODEL=qwen3.5:9b),
# hoac bang cach tro toi mot file config khac qua LOCAL_AI_GATEWAY_CONFIG.

provider: ollama

ollama:
  endpoint: http://localhost:11434
  model: qwen3.5:9b

# Timeout mac dinh (giay) neu budget khong tu dinh nghia rieng.
timeout_seconds: 60

retry:
  max_attempts: 3
  backoff_base_seconds: 0.5

concurrency:
  # Max parallel requests allowed. Default = 1 because limited VRAM can easily overflow
  # when running multiple large-context requests simultaneously.
  # Increase this if you monitor that you have enough free VRAM.
  max_parallel_requests: 1

logging:
  level: INFO
  # Chi bat true khi dev/debug local - se ghi ca noi dung task/context/response.
  debug_log_content: false

file_access:
  # Danh sach thu muc goc duoc phep doc qua tham so file_paths cua call_local.
  # Rong = tinh nang TAT (an toan mac dinh). Vi du bat cho 1 project:
  #   allowed_roots: ["D:/project/mcp"]
  allowed_roots: []
  max_file_bytes: 200000
  max_total_bytes: 800000

cache:
  # Cache response theo (prompt cuoi cung da build + options) de khong tra
  # gia inference/GPU lap lai cho cung mot cau hoi/file.
  enabled: true
  max_entries: 256
  ttl_seconds: 3600
